name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Lint script
        run: |
          sudo apt-get install -y shellcheck
          shellcheck bin/devdash

      - name: Run tests
        run: bash test/test.sh

      # npm publishing is disabled: this bash CLI is deprecated and the
      # @devdashproject/devdash-cli package now belongs to the Go CLI
      # (devdashproject/devdash-cli). Publishing here would overwrite it.

      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
