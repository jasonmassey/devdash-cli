name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked recovery logs and production dumps
        run: |
          if [ -n "$(git ls-files -- '.recovery' ':(glob)**/prod-*.dump' ':(glob)**/prod-*.sql' ':(glob)**/prod-*.sql.gz')" ]; then
            echo 'Tracked recovery logs or production dumps are prohibited.' >&2
            exit 1
          fi

      - name: Lint
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --exclude=SC2016,SC2034,SC2059 bin/devdash
          shellcheck --exclude=SC2016 test/helpers.sh test/test_offline.sh test/test_api.sh test/mock/curl

      - name: Test
        run: bash test/test.sh
